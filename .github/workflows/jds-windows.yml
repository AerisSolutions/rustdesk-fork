# JDS: build only the Windows x86_64 RustDesk (no Android, macOS, Linux, ARM64 or iOS)
# Copied from the Windows job in flutter-build.yml, run by hand from the Actions tab
# The build is uploaded to the update host with latest-technician-build.json. The Publish installers
# action in the setup repo packages it into the Technician installer Sheriff offers. See the notes at
# the bottom of the file for the repo secrets this needs
name: JDS Windows build

on:
  workflow_dispatch:

env:
  SCITER_RUST_VERSION: "1.75"
  LLVM_VERSION: "15.0.6"
  FLUTTER_VERSION: "3.24.5"
  VCPKG_BINARY_SOURCES: "clear;x-gha,readwrite"
  VCPKG_COMMIT_ID: "9e593bb18ea69cc5095e012465dcd675a822ed0d"
  VERSION: "1.5.1"
  UPDATE_HOST: "https://updates.sheriff.aerissolutions.com"
  REMOTE_DIR: "/var/updates"

jobs:
  generate-bridge:
    uses: ./.github/workflows/bridge.yml

  build-RustDeskTempTopMostWindow:
    uses: ./.github/workflows/third-party-RustDeskTempTopMostWindow.yml
    with:
      upload-artifact: true
      target: windows-2022
      configuration: Release
      platform: x64
      target_version: Windows10

  build-for-windows-flutter:
    name: x86_64-pc-windows-msvc
    needs: [build-RustDeskTempTopMostWindow, generate-bridge]
    runs-on: windows-2022
    steps:
      - name: Export GitHub Actions cache environment variables
        uses: actions/github-script@d7906e4ad0b1822421a7e6a35d5ca353c962f410 # v6
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

      - name: Checkout source code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          submodules: recursive

      - name: Restore bridge files
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: bridge-artifact
          path: ./

      - name: Install LLVM and Clang
        uses: KyleMayes/install-llvm-action@ebc0426251bc40c7cd31162802432c68818ab8f0 # v2.0.9
        with:
          version: ${{ env.LLVM_VERSION }}

      - name: Install flutter
        uses: subosito/flutter-action@2783a3f08e1baf891508463f8c6653c258246225 # v2.12.0
        with:
          channel: "stable"
          flutter-version: ${{ env.FLUTTER_VERSION }}
          architecture: x64

      - name: Replace engine with rustdesk custom flutter engine
        run: |
          flutter doctor -v
          flutter precache --windows
          Invoke-WebRequest -Uri https://github.com/rustdesk/engine/releases/download/main/windows-x64-release.zip -OutFile windows-x64-release.zip
          Expand-Archive -Path windows-x64-release.zip -DestinationPath windows-x64-release
          mv -Force windows-x64-release/*  C:/hostedtoolcache/windows/flutter/stable-${{ env.FLUTTER_VERSION }}-x64/bin/cache/artifacts/engine/windows-x64-release/

      - name: Patch flutter
        shell: bash
        run: |
          cp .github/patches/flutter_3.24.4_dropdown_menu_enableFilter.diff $(dirname $(dirname $(which flutter)))
          cd $(dirname $(dirname $(which flutter)))
          [[ "3.24.5" == ${{env.FLUTTER_VERSION}} ]] && git apply flutter_3.24.4_dropdown_menu_enableFilter.diff

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: ${{ env.SCITER_RUST_VERSION }}
          targets: x86_64-pc-windows-msvc
          components: "rustfmt"

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          prefix-key: windows-2022

      - name: Setup vcpkg with Github Actions binary cache
        uses: lukka/run-vcpkg@b1a0dd252f06b9e25b3c022a9a03bd7a427fb6a2 # v11
        with:
          vcpkgDirectory: C:\vcpkg
          vcpkgGitCommitId: ${{ env.VCPKG_COMMIT_ID }}
          doNotCache: false

      - name: Install vcpkg dependencies
        env:
          VCPKG_DEFAULT_HOST_TRIPLET: x64-windows-static
        shell: bash
        run: |
          $VCPKG_ROOT/vcpkg install --triplet x64-windows-static --x-install-root="$VCPKG_ROOT/installed"

      - name: Build rustdesk
        env:
          # JDS: the full Sheriff address Remote Control tickets are redeemed at (jds_ticket.dart), from
          # the repo's JDS_REDEEM_URL Actions variable so it isn't in the code; build.py passes it to Flutter
          JDS_FLUTTER_BUILD_ARGS: --dart-define=JDS_REDEEM_URL=${{ vars.JDS_REDEEM_URL }}
        run: |
          python3 .\build.py --portable --flutter --skip-portable-pack --hwcodec --vram
          mv ./flutter/build/windows/x64/runner/Release ./rustdesk

          # Virtual display driver, same as upstream
          Invoke-WebRequest -Uri https://github.com/rustdesk-org/rdev/releases/download/usbmmidd_v2/usbmmidd_v2.zip -OutFile usbmmidd_v2.zip
          Expand-Archive usbmmidd_v2.zip -DestinationPath .
          Remove-Item -Path usbmmidd_v2\Win32 -Recurse
          Remove-Item -Path "usbmmidd_v2\deviceinstaller64.exe", "usbmmidd_v2\deviceinstaller.exe", "usbmmidd_v2\usbmmidd.bat"
          mv -Force .\usbmmidd_v2 ./rustdesk

      - name: Download RustDeskTempTopMostWindow artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: topmostwindow-artifacts-x64
          path: "./rustdesk"

      - name: Upload unsigned
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rustdesk-unsigned-windows-x86_64
          path: rustdesk

      - name: Zip the build + write manifest
        shell: pwsh
        run: |
          # the version label is <VERSION>.<run number>, e.g. 1.5.1.7
          $version = "$env:VERSION.$env:GITHUB_RUN_NUMBER"
          $zip = "rustdesk-technician-build-$version.zip"
          $null = New-Item -ItemType Directory -Path technician-build
          Compress-Archive -Path rustdesk\* -DestinationPath "technician-build\$zip"
          $sha = (Get-FileHash -LiteralPath "technician-build\$zip" -Algorithm SHA256).Hash.ToLower()
          $manifest = [ordered]@{ version = $version; url = "$env:UPDATE_HOST/$zip"; checksum = $sha } | ConvertTo-Json
          [IO.File]::WriteAllText("$PWD\technician-build\latest-technician-build.json", $manifest)
          Write-Host "Built $zip (sha256 $sha)"

      - name: Keep the zip and manifest for the publish job
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rustdesk-technician-build
          path: technician-build
          retention-days: 1

  # on the self-hosted runner, the same as the other uploads to the update host
  publish:
    needs: [build-for-windows-flutter]
    runs-on: [self-hosted, linux, x64]
    steps:
      - name: Restore the zip and manifest
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: rustdesk-technician-build
          path: technician-build

      - name: Upload to update host (zip first, manifest last)
        working-directory: technician-build
        run: |
          # DEPLOY_SSH_KEY is the AWS RSA private key (.pem) - scp uses it directly, no conversion
          printf '%s\n' "${{ secrets.DEPLOY_SSH_KEY }}" > "$RUNNER_TEMP/deploy_key"
          chmod 600 "$RUNNER_TEMP/deploy_key"
          SCP="scp -i $RUNNER_TEMP/deploy_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new"
          DEST="${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}:${{ env.REMOTE_DIR }}"
          # zip first so the manifest never points at a missing file
          $SCP rustdesk-technician-build-*.zip "$DEST/"
          $SCP latest-technician-build.json "$DEST/"

      - name: Remove temporary files
        if: always()
        shell: bash
        run: |
          rm -f "$RUNNER_TEMP/deploy_key"
          rm -rf technician-build

# -----------------------------------------------------------------------------------------------
# Repo secrets this workflow needs (Settings -> Secrets and variables -> Actions -> Secrets):
#   DEPLOY_SSH_KEY   the AWS RSA private key (.pem contents) for a user that can write to REMOTE_DIR
#   DEPLOY_HOST      the EC2 public DNS / IP (or the update host in front of it)
#   DEPLOY_USER      the ssh user: "ubuntu" on Ubuntu AMIs, "ec2-user" on Amazon Linux
# The same three secrets jds-android.yml uses
# -----------------------------------------------------------------------------------------------
